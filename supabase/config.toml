# Configuración de Supabase para Mente al Día (Fase 4).
# Solo se fijan los valores que importan para la seguridad; el resto usa los de la CLI.
# En el proyecto en la nube, estos mismos valores se revisan en el panel de Supabase
# (ver docs/BASE_DE_DATOS.md, «Configurar el proyecto»).
project_id = "mente-al-dia"

[api]
enabled = true
# Solo public se expone por la API. El esquema «privado» queda fuera a propósito.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/panel/definir-contrasena"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Las cuentas del panel se crean solo por invitación (función «invitar-usuario»).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

# Doble factor obligatorio para el panel: lo exigen las políticas de la base de datos (aal2).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# verify_jwt = false: el sitio usa la clave publicable, que no es un JWT. Cada función valida
# lo suyo: «enviar-cuestionario» es pública (solo recibe respuestas) e «invitar-usuario»
# verifica el token y el rol de quien llama.
[functions.enviar-cuestionario]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.invitar-usuario]
verify_jwt = false
import_map = "./functions/deno.json"
