# Configuración de Supabase para Mente al Día (Fase 4).
# Solo se fijan los valores que importan para la seguridad; el resto usa los de la CLI.
# En el proyecto en la nube, estos mismos valores se revisan en el panel de Supabase
# (ver docs/BASE_DE_DATOS.md, «Configurar el proyecto»).
project_id = "mente-al-dia"

[api]
enabled = true
# Solo public se expone por la API. El esquema «privado» queda fuera a propósito.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/panel/definir-contrasena",
  "http://localhost:5173/cuenta/nueva-contrasena",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Cualquier persona puede crear su cuenta pública (D-77). Eso no da acceso al panel: el equipo
# sigue entrando por invitación (función «invitar-usuario») y los roles viven en public.perfiles.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
# Activa el proveedor Email (ingreso con correo y contraseña). Con false nadie podría ingresar.
enable_signup = true
double_confirm_changes = true
# Sin un SMTP propio, el correo de Supabase solo llega a quienes son miembros de la organización:
# con confirmación obligatoria nadie más podría entrar. Al conectar un SMTP se puede volver a true.
enable_confirmations = false
secure_password_change = true
max_frequency = "1m0s"
# Código del segundo paso del panel (D-89): 6 dígitos que vencen a los 10 minutos.
otp_length = 6
otp_expiry = 600

# Correos en español (D-79). Las rutas son desde la raíz del proyecto.
[auth.email.template.recovery]
subject = "Crea una contraseña nueva para Mente al Día"
content_path = "./supabase/templates/recuperacion.html"

[auth.email.template.confirmation]
subject = "Confirma tu cuenta de Mente al Día"
content_path = "./supabase/templates/confirmacion.html"

[auth.email.template.invite]
subject = "Te invitaron al panel de Mente al Día"
content_path = "./supabase/templates/invitacion.html"

[auth.email.template.email_change]
subject = "Confirma tu nuevo correo en Mente al Día"
content_path = "./supabase/templates/cambio-correo.html"

# El código del segundo paso del panel (D-89) sale con la plantilla del ingreso por correo
# («magic link»), que aquí lleva el código ({{ .Token }}) y no un enlace.
[auth.email.template.magic_link]
subject = "Tu código para entrar a Mente al Día"
content_path = "./supabase/templates/codigo.html"

# El panel ya no usa una aplicación de autenticación (D-89): el segundo paso es el código por
# correo, y la base de datos ya no acepta el nivel aal2 como verificación. No se inscriben
# aplicaciones nuevas; la comprobación queda activa solo para no cortar el ingreso anterior
# mientras se publica el cambio.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = true

[auth.rate_limit]
# Correos por hora con el SMTP propio (D-79): Gmail admite unos 500 al día.
email_sent = 60
sign_in_sign_ups = 30
token_verifications = 30

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# verify_jwt = false: el sitio usa la clave publicable, que no es un JWT. Cada función valida
# lo suyo: «enviar-cuestionario» es pública (solo recibe respuestas); «invitar-usuario» y
# «codigo-panel» verifican el token y el rol de quien llama.
[functions.enviar-cuestionario]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.invitar-usuario]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.codigo-panel]
verify_jwt = false
import_map = "./functions/deno.json"

# Proyecto en la nube (D-67). Usa los mismos valores de arriba, salvo las direcciones, que son
# las del sitio publicado. Se aplica con `supabase config push` (vista previa: `config diff`).
[remotes.produccion]
project_id = "lpcfrtlfiljgwxarpslf"

[remotes.produccion.auth]
site_url = "https://michaelpob.github.io/mente-al-dia/"
additional_redirect_urls = [
  "https://michaelpob.github.io/mente-al-dia/panel/definir-contrasena",
  "https://michaelpob.github.io/mente-al-dia/cuenta/nueva-contrasena",
]

# Correo propio (D-79, pendiente F12-01): Gmail con una contraseña de aplicación. El correo y la
# contraseña NO van en este archivo: se ponen en la terminal antes de `config push`
# ($env:SUPABASE_AUTH_SMTP_USER y $env:SUPABASE_AUTH_SMTP_PASS en PowerShell).
[remotes.produccion.auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "env(SUPABASE_AUTH_SMTP_USER)"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "env(SUPABASE_AUTH_SMTP_USER)"
sender_name = "Mente al Día"
